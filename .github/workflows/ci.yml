name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run tests
        run: |
          set -o pipefail
          uv run pytest -q 2>&1 | tee pytest.log

      - name: Report test failures
        if: failure()
        run: |
          if [ ! -f pytest.log ]; then
            echo "::error::pytest.log was not created"
            exit 0
          fi

          summary="$(grep -E '^(FAILED|ERROR)' pytest.log | head -20 | tr '\n' ';' | cut -c1-800)"

          if [ -z "$summary" ]; then
            summary="$(tail -20 pytest.log | tr '\n' ' ' | cut -c1-800)"
          fi

          echo "::error::${summary}"

  gui:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen --extra gui

      - name: Run GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run pytest -q \
            tests/test_gui.py \
            tests/test_download_worker.py \
            tests/test_lyrics_scan_worker.py
