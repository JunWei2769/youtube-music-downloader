# Project configuration file
# - Project name
# - Version
# - Python version requirement
# - Dependencies
# - CLI entry point
# - Build configuration
# - Development dependencies

[project]
name = "youtube-music-downloader"
version = "0.2.0"
description = "A CLI tool for downloading YouTube Music playlists with lyrics."
readme = "README.md"
authors = [
    { name = "Jun Wei", email = "limjunwei01012005@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "mutagen>=1.48.1",
    "opencc-python-reimplemented>=0.1.7",
    "yt-dlp[default]>=2026.7.4",
]

[project.scripts]
ytmusic-dl = "ytmusic_dl.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bgutil-ytdlp-pot-provider>=1.3.1",
    "pytest>=9.1.1",
]

[tool.uv.build-backend]
module-name = "ytmusic_dl"
module-root = "src"
